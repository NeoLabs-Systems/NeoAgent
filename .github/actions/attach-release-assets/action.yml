name: Attach release assets
description: Upload finished files to the GitHub release immediately and refresh the download notes.

inputs:
  release_tag:
    description: Release tag to attach files to
    required: false
    default: ''
  files:
    description: Newline-separated file paths or globs to upload
    required: true

runs:
  using: composite
  steps:
    - name: Attach files and refresh download notes
      if: inputs.release_tag != ''
      working-directory: ${{ github.workspace }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        FILE_PATTERNS: ${{ inputs.files }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        if [ -z "$RELEASE_TAG" ]; then
          exit 0
        fi

        files=()
        while IFS= read -r pattern; do
          pattern="${pattern//$'\r'/}"
          if [ -z "$pattern" ]; then
            continue
          fi
          for match in $pattern; do
            if [ -f "$match" ]; then
              files+=("$match")
            fi
          done
        done <<< "$FILE_PATTERNS"

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No release files matched the provided patterns."
          exit 1
        fi

        existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null || echo '{"assets":[]}')"
        pending_files=()
        for f in "${files[@]}"; do
          name="$(basename "$f")"
          size="$(wc -c < "$f" | tr -d ' ')"
          if jq --exit-status --arg name "$name" --argjson size "$size" \
            '.assets | any(.name == $name and .size == $size)' <<<"$existing_assets" >/dev/null; then
            echo "Already attached with matching size: $name"
            continue
          fi
          pending_files+=("$f")
        done

        uploaded=0
        if [ "${#pending_files[@]}" -eq 0 ]; then
          uploaded=1
        fi
        for attempt in 1 2 3 4 5; do
          if [ "$uploaded" -eq 1 ]; then
            break
          fi
          if gh release upload "$RELEASE_TAG" "${pending_files[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
            uploaded=1
            break
          fi
          echo "GitHub release upload failed (attempt ${attempt}); retrying..."
          sleep $((attempt * 5))
        done
        if [ "$uploaded" -ne 1 ]; then
          echo "Could not attach files to ${RELEASE_TAG}."
          exit 1
        fi

        # Jobs without Go (the Android build) leave the notes to the final
        # release-assets job, which refreshes them once everything is attached.
        if [ -d cmd/neoagent-release ] && command -v go >/dev/null 2>&1; then
          for attempt in 1 2 3 4 5; do
            if go run ./cmd/neoagent-release release-download --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "Release download notes update failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Attached files to ${RELEASE_TAG}, but the release download notes could not be refreshed."
        fi
