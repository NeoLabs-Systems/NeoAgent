name: Set up Go
description: Installs the Go version from go.mod and downloads the module dependencies.

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download modules
      shell: bash
      env:
        GOWORK: 'off'
      run: go mod download
