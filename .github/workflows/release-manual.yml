name: Release Manual

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      upload_web: true

  release:
    name: Bump version and publish manual release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.bump.outputs.version }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve latest tag and bump version
        id: bump
        run: |
          git fetch --tags --force

          LATEST_TAG=$(git tag --list "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi

          LATEST_VERSION=${LATEST_TAG#v}
          IFS=. read -r major minor patch <<< "${LATEST_VERSION%%-*}"
          case "${{ github.event.inputs.version_bump }}" in
            major) NEW_VERSION="$((major + 1)).0.0" ;;
            minor) NEW_VERSION="${major}.$((minor + 1)).0" ;;
            *) NEW_VERSION="${major}.${minor}.$((patch + 1))" ;;
          esac

          go run ./cmd/neoagent-release set-version "$NEW_VERSION"
          git add internal/buildinfo/VERSION package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}" -m "chore(release): v${NEW_VERSION}"

          echo "NEW_VERSION=v${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "version=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push version bump
        run: |
          git push origin HEAD
          git push origin "${{ env.NEW_VERSION }}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.NEW_VERSION }}" \
            --title "Release ${{ env.NEW_VERSION }}" \
            --generate-notes \
            --latest

      - name: Add download links to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/neoagent-release release-download --tag "${{ env.NEW_VERSION }}"

      - name: Capture release sha
        id: capture_release_sha
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build Installers
    needs: release
    uses: ./.github/workflows/_build-installers.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      use_ci_web: true

  build-firmware:
    name: Build Wearable Firmware
    needs: release
    uses: ./.github/workflows/_build-firmware.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker Image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      use_ci_web: true

  publish-release-assets:
    name: Publish Release Assets
    # Runs when a build failed, so what did build is attached, but not for a
    # cancelled run. The manifest step refuses an incomplete platform set.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs:
      - release
      - build-installers
      - build-firmware
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit

  notify-discord:
    name: Notify Discord
    needs: release
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
