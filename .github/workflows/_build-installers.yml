name: Reusable Installers

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build installers from
        required: true
        type: string
      release_tag:
        description: Release tag used to version artifacts
        required: false
        default: ''
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY:
        required: false
      WINDOWS_SIGNING_CERTIFICATE_BASE64:
        required: false
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:
        required: false
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_IDENTITY:
        required: false
      APPLE_NOTARY_PRIVATE_KEY_BASE64:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows Installer (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter publishes an x64 SDK executable for Windows. On the native
          # ARM runner it executes under emulation while Flutter targets the
          # runner architecture for the desktop build.
          architecture: x64
          cache: true

      - name: Enable desktop platforms
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows runner project exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Resolve runtime signing key
        shell: pwsh
        env:
          RUNTIME_SIGNING_PUBLIC_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          $publicKey = $env:RUNTIME_SIGNING_PUBLIC_KEY
          if ([string]::IsNullOrWhiteSpace($publicKey)) {
            Write-Warning "No NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY secret configured; building with an ephemeral key. This build is unsigned."
            $publicKey = (node -e "const c=require('crypto');const k=c.generateKeyPairSync('ed25519');const d=k.publicKey.export({type:'spki',format:'der'});console.log(d.subarray(d.length-32).toString('base64'))").Trim()
          }
          "RUNTIME_SIGNING_PUBLIC_KEY=$publicKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCert = -not ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) -and -not ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD))
          if (-not $hasCert) {
            Write-Warning "No Windows Authenticode signing credentials configured; shipping this build unsigned."
          }
          "WINDOWS_SIGN_ENABLED=$hasCert" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows signing certificate
        if: env.WINDOWS_SIGN_ENABLED == 'True'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "neoagent-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          )
          "NEOAGENT_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows app
        shell: pwsh
        run: |
          $channel = if ("${{ inputs.release_tag }}" -match "-beta\\.") { "beta" } else { "stable" }
          flutter build windows --release --dart-define=NEOAGENT_RUNTIME_PUBLIC_KEY=$env:RUNTIME_SIGNING_PUBLIC_KEY --dart-define=NEOAGENT_RELEASE_CHANNEL=$channel

      - name: Sign Windows application
        if: env.WINDOWS_SIGN_ENABLED == 'True'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe was not found."
          }
          Get-ChildItem "build/windows/${{ matrix.architecture }}/runner/Release" -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:NEOAGENT_WINDOWS_CERTIFICATE /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($_.Name)." }
            }

      - name: Resolve app version
        shell: pwsh
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $raw = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = "0.0.${{ github.run_number }}"
          }
          $version = $raw.TrimStart('v', 'V')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "build/windows/${{ matrix.architecture }}/runner/Release"
          $exe = Get-ChildItem $releaseDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No executable found in $releaseDir"
          }

          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          $scriptPath = Join-Path $env:RUNNER_TEMP "neoagent-installer.iss"
          $issLines = @(
            '#define MyAppName "NeoAgent"'
            ('#define MyAppVersion "' + '${{ steps.version.outputs.version }}' + '"')
            '#define MyAppPublisher "NeoAgent"'
            ('#define MyAppExeName "' + $exe.Name + '"')
            ''
            '[Setup]'
            'AppId={{C5F1E5F6-1D17-4AC8-9E26-86AC8EC36B58}'
            'AppName={#MyAppName}'
            'AppVersion={#MyAppVersion}'
            'AppPublisher={#MyAppPublisher}'
            'DefaultDirName={autopf}\{#MyAppName}'
            'DefaultGroupName={#MyAppName}'
            'DisableProgramGroupPage=yes'
            "OutputDir=$distDir"
            'OutputBaseFilename=neoagent-windows-${{ matrix.architecture }}-setup-{#MyAppVersion}'
            'Compression=lzma'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'ArchitecturesAllowed=${{ matrix.architecture }}'
            'ArchitecturesInstallIn64BitMode=${{ matrix.architecture }}'
            'UninstallDisplayIcon={app}\{#MyAppExeName}'
            ''
            '[Languages]'
            'Name: "english"; MessagesFile: "compiler:Default.isl"'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"'
            ''
            '[Files]'
            ('Source: "' + $releaseDir + '\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs')
            ''
            '[Icons]'
            'Name: "{autoprograms}\\{#MyAppName}"; Filename: "{app}\\{#MyAppExeName}"'
            'Name: "{autodesktop}\\{#MyAppName}"; Filename: "{app}\\{#MyAppExeName}"; Tasks: desktopicon'
            ''
            '[Run]'
            'Filename: "{app}\\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent'
          )
          Set-Content -Path $scriptPath -Value ($issLines -join "`r`n") -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $scriptPath

      - name: Sign Windows installer
        if: env.WINDOWS_SIGN_ENABLED == 'True'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist\neoagent-windows-${{ matrix.architecture }}-setup-*.exe" |
            ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:NEOAGENT_WINDOWS_CERTIFICATE /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
            }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-windows-installer-${{ matrix.architecture }}
          path: dist/neoagent-windows-${{ matrix.architecture }}-setup-*.exe
          if-no-files-found: error

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bundled web client for Windows runtime
        shell: pwsh
        working-directory: ${{ github.workspace }}/flutter_app
        run: |
          $webOutput = Join-Path $env:GITHUB_WORKSPACE "server/public"
          New-Item -ItemType Directory -Force -Path (Join-Path $webOutput "assets/shaders") | Out-Null
          $buildId = node ../scripts/web_build_id.js
          flutter build web --output $webOutput --dart-define=NEOAGENT_BACKEND_URL= --dart-define=NEOAGENT_WEB_BUILD_ID=$buildId

      - name: Install Windows backend dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Build standalone Windows CLI
        if: inputs.release_tag != ''
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY: ${{ env.RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = node -p "process.arch"
          if ($arch -ne "${{ matrix.architecture }}") {
            throw "Expected ${{ matrix.architecture }} runner, received $arch."
          }
          node scripts/build_cli_sea.js --output "dist/neoagent-cli-windows-$arch-$version.exe"

      - name: Sign standalone Windows CLI
        if: inputs.release_tag != '' && env.WINDOWS_SIGN_ENABLED == 'True'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          Get-ChildItem "dist/neoagent-cli-windows-*.exe" |
            ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:NEOAGENT_WINDOWS_CERTIFICATE /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Standalone CLI signing failed." }
            }

      - name: Prune Windows runtime dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Build Windows backend runtime
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = node -p "process.arch"
          $stage = Join-Path $env:RUNNER_TEMP "neoagent-runtime-windows-$arch"
          $asset = Join-Path $env:GITHUB_WORKSPACE "dist/neoagent-runtime-windows-$arch-$version.zip"
          node scripts/stage_runtime.js --output $stage --node (Get-Command node).Source
          Compress-Archive -Path "$stage\*" -DestinationPath $asset -CompressionLevel Optimal
          node scripts/create_runtime_metadata.js --asset $asset --output "dist/neoagent-runtime-metadata-windows-$arch.json" --platform windows --architecture $arch

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-windows-runtime-${{ matrix.architecture }}
          path: |
            dist/neoagent-cli-windows-*.exe
            dist/neoagent-runtime-windows-*.zip
            dist/neoagent-runtime-metadata-windows-*.json
          if-no-files-found: error

  build-macos-installer:
    name: Build macOS Installer (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop platforms
        run: flutter config --enable-macos-desktop

      - name: Ensure macOS runner project exists
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve runtime signing key
        env:
          RUNTIME_SIGNING_PUBLIC_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          PUBLIC_KEY="$RUNTIME_SIGNING_PUBLIC_KEY"
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::warning::No NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY secret configured; building with an ephemeral key. This build is unsigned."
            PUBLIC_KEY="$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ed25519');const d=k.publicKey.export({type:'spki',format:'der'});console.log(d.subarray(d.length-32).toString('base64'))")"
          fi
          echo "RUNTIME_SIGNING_PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Resolve macOS signing configuration
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          HAS_CERT=true
          for value in \
            "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" \
            "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            "$APPLE_DEVELOPER_ID_IDENTITY" \
            "$APPLE_NOTARY_PRIVATE_KEY_BASE64" \
            "$APPLE_NOTARY_KEY_ID" \
            "$APPLE_NOTARY_ISSUER_ID"
          do
            if [ -z "$value" ]; then
              HAS_CERT=false
            fi
          done
          if [ "$HAS_CERT" = "false" ]; then
            echo "::warning::No Developer ID signing/notarization credentials configured; shipping this build unsigned and un-notarized."
          fi
          echo "APPLE_SIGN_ENABLED=$HAS_CERT" >> "$GITHUB_ENV"

      - name: Prepare macOS signing identity
        if: env.APPLE_SIGN_ENABLED == 'true'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/neoagent-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/neoagent-developer-id.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "NEOAGENT_APPLE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS app
        run: |
          CHANNEL="stable"
          case "${{ inputs.release_tag }}" in
            *-beta.*) CHANNEL="beta" ;;
          esac
          flutter build macos --release \
            --dart-define=NEOAGENT_RUNTIME_PUBLIC_KEY="$RUNTIME_SIGNING_PUBLIC_KEY" \
            --dart-define=NEOAGENT_RELEASE_CHANNEL="$CHANNEL"

      - name: Sign macOS application
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_BUNDLE=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi

          if [ -n "${APPLE_DEVELOPER_ID_IDENTITY:-}" ]; then
            codesign \
              --force \
              --deep \
              --options runtime \
              --timestamp \
              --sign "$APPLE_DEVELOPER_ID_IDENTITY" \
              "$APP_BUNDLE"
          else
            codesign --force --deep --sign - "$APP_BUNDLE"
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE"
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}

      - name: Resolve app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RAW_VERSION="${RELEASE_TAG}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="0.0.${{ github.run_number }}"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install DMG builder
        run: brew install create-dmg

      - name: Build macOS installer
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_BUNDLE=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          ARCH="$(node -p process.arch)"
          if [ "$ARCH" != "${{ matrix.architecture }}" ]; then
            echo "Expected ${{ matrix.architecture }} runner, received $ARCH."
            exit 1
          fi
          DMG_PATH="$DIST_DIR/neoagent-macos-$ARCH-${{ steps.version.outputs.version }}.dmg"
          mkdir -p "$DIST_DIR"
          bash ../scripts/build_macos_dmg.sh "$APP_BUNDLE" "$DMG_PATH"

      - name: Sign, notarize, and staple macOS installer
        if: inputs.release_tag != '' && env.APPLE_SIGN_ENABLED == 'true'
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          DMG_PATH="$GITHUB_WORKSPACE/dist/neoagent-macos-${{ matrix.architecture }}-${{ steps.version.outputs.version }}.dmg"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          codesign \
            --force \
            --timestamp \
            --sign "$APPLE_DEVELOPER_ID_IDENTITY" \
            "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-macos-installer-${{ matrix.architecture }}
          path: dist/neoagent-macos-*.dmg
          if-no-files-found: error

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bundled web client for macOS runtime
        working-directory: ${{ github.workspace }}/flutter_app
        run: |
          BUILD_ID="$(node ../scripts/web_build_id.js)"
          flutter build web \
            --output ../server/public \
            --dart-define=NEOAGENT_BACKEND_URL= \
            --dart-define=NEOAGENT_WEB_BUILD_ID="$BUILD_ID"

      - name: Install macOS backend dependencies
        working-directory: ${{ github.workspace }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Build standalone macOS CLI
        if: inputs.release_tag != ''
        working-directory: ${{ github.workspace }}
        env:
          NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY: ${{ env.RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(node -p process.arch)"
          node scripts/build_cli_sea.js \
            --output "dist/neoagent-cli-macos-$ARCH-$VERSION"

      - name: Sign standalone macOS CLI
        if: inputs.release_tag != '' && env.APPLE_SIGN_ENABLED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          for CLI_PATH in dist/neoagent-cli-macos-*; do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$APPLE_DEVELOPER_ID_IDENTITY" \
              "$CLI_PATH"
            codesign --verify --strict --verbose=4 "$CLI_PATH"
          done

      - name: Prune macOS runtime dependencies
        working-directory: ${{ github.workspace }}
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Build macOS backend runtime
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(node -p process.arch)"
          STAGE="$RUNNER_TEMP/neoagent-runtime-macos-$ARCH"
          ASSET="$GITHUB_WORKSPACE/dist/neoagent-runtime-macos-$ARCH-$VERSION.zip"
          node scripts/stage_runtime.js --output "$STAGE" --node "$(command -v node)"
          (
            cd "$STAGE"
            zip -qry "$ASSET" .
          )
          node scripts/create_runtime_metadata.js \
            --asset "$ASSET" \
            --output "dist/neoagent-runtime-metadata-macos-$ARCH.json" \
            --platform macos \
            --architecture "$ARCH"

      - name: Upload macOS runtime
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-macos-runtime-${{ matrix.architecture }}
          path: |
            dist/neoagent-cli-macos-*
            dist/neoagent-runtime-macos-*.zip
            dist/neoagent-runtime-metadata-macos-*.json
          if-no-files-found: error

  build-linux-installer:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            ruby-full \
            libarchive-tools \
            liblzma-dev \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpulse-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev
          sudo gem install --no-document fpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop platforms
        run: flutter config --enable-linux-desktop

      - name: Ensure Linux runner project exists
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve runtime signing key
        env:
          RUNTIME_SIGNING_PUBLIC_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          PUBLIC_KEY="$RUNTIME_SIGNING_PUBLIC_KEY"
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::warning::No NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY secret configured; building with an ephemeral key. This build is unsigned."
            PUBLIC_KEY="$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ed25519');const d=k.publicKey.export({type:'spki',format:'der'});console.log(d.subarray(d.length-32).toString('base64'))")"
          fi
          echo "RUNTIME_SIGNING_PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Build Linux app
        run: |
          CHANNEL="stable"
          case "${{ inputs.release_tag }}" in
            *-beta.*) CHANNEL="beta" ;;
          esac
          flutter build linux --release \
            --dart-define=NEOAGENT_RUNTIME_PUBLIC_KEY="$RUNTIME_SIGNING_PUBLIC_KEY" \
            --dart-define=NEOAGENT_RELEASE_CHANNEL="$CHANNEL"

      - name: Resolve app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RAW_VERSION="${RELEASE_TAG}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="0.0.${{ github.run_number }}"
          fi
          VERSION="${RAW_VERSION#v}"
          DEB_VERSION="$(printf '%s' "$VERSION" | sed 's/-/~/g')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux installers
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          PKG_ROOT="$RUNNER_TEMP/neoagent-deb"
          ARCH_ROOT="$RUNNER_TEMP/neoagent-arch"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APP_DIR="$PKG_ROOT/opt/neoagent"
          DESKTOP_DIR="$PKG_ROOT/usr/share/applications"
          BIN_LINK_DIR="$PKG_ROOT/usr/local/bin"
          ARCH_APP_DIR="$ARCH_ROOT/opt/neoagent"
          ARCH_DESKTOP_DIR="$ARCH_ROOT/usr/share/applications"
          ARCH_BIN_LINK_DIR="$ARCH_ROOT/usr/bin"
          APP_BIN=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -executable | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "No executable found in $BUNDLE_DIR"
            exit 1
          fi
          APP_BIN_NAME=$(basename "$APP_BIN")
          rm -rf "$PKG_ROOT" "$ARCH_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN" "$APP_DIR" "$DESKTOP_DIR" "$BIN_LINK_DIR" "$DIST_DIR"
          mkdir -p "$ARCH_APP_DIR" "$ARCH_DESKTOP_DIR" "$ARCH_BIN_LINK_DIR"
          cp -R "$BUNDLE_DIR"/* "$APP_DIR/"
          cp "linux/runner/resources/app_icon.png" "$APP_DIR/app_icon.png"
          ln -sf "/opt/neoagent/$APP_BIN_NAME" "$BIN_LINK_DIR/neoagent"
          cp -R "$BUNDLE_DIR"/* "$ARCH_APP_DIR/"
          cp "linux/runner/resources/app_icon.png" "$ARCH_APP_DIR/app_icon.png"
          ln -sf "/opt/neoagent/$APP_BIN_NAME" "$ARCH_BIN_LINK_DIR/neoagent"
          printf '%s\n' \
            'Package: neoagent' \
            'Version: ${{ steps.version.outputs.deb_version }}' \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: NeoAgent <https://github.com/NeoLabs-Systems/NeoAgent>' \
            'Description: NeoAgent Flutter desktop app' \
            > "$PKG_ROOT/DEBIAN/control"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=NeoAgent' \
            "Exec=/opt/neoagent/$APP_BIN_NAME" \
            'Icon=/opt/neoagent/app_icon.png' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Utility;' \
            > "$DESKTOP_DIR/neoagent.desktop"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=NeoAgent' \
            "Exec=/opt/neoagent/$APP_BIN_NAME" \
            'Icon=/opt/neoagent/app_icon.png' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Utility;' \
            > "$ARCH_DESKTOP_DIR/neoagent.desktop"
          chmod 0755 "$PKG_ROOT/DEBIAN"
          chmod 0644 "$PKG_ROOT/DEBIAN/control"
          dpkg-deb --build "$PKG_ROOT" "$DIST_DIR/neoagent-linux-amd64-${{ steps.version.outputs.deb_version }}.deb"
          fpm -s dir -t pacman \
            -n neoagent \
            -v "${{ steps.version.outputs.deb_version }}" \
            --iteration 1 \
            --architecture x86_64 \
            --maintainer "NeoAgent <https://github.com/NeoLabs-Systems/NeoAgent>" \
            --description "NeoAgent Flutter desktop app" \
            -C "$ARCH_ROOT" \
            --package "$DIST_DIR/neoagent-arch-x86_64-${{ steps.version.outputs.deb_version }}-1.pkg.tar.zst" \
            .

      - name: Build AppImage
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="$RUNNER_TEMP/NeoAgent.AppDir"
          VERSION="${{ steps.version.outputs.version }}"

          APP_BIN=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -executable | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "No executable found in $BUNDLE_DIR"
            exit 1
          fi
          APP_BIN_NAME=$(basename "$APP_BIN")

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr"
          cp -R "$BUNDLE_DIR"/. "$APPDIR/usr/"
          cp "linux/runner/resources/app_icon.png" "$APPDIR/app_icon.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=NeoAgent' \
            'Exec=neoagent' \
            'Icon=app_icon' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Utility;' \
            > "$APPDIR/neoagent.desktop"

          {
            printf '%s\n' '#!/bin/sh'
            # shellcheck disable=SC2016
            printf '%s\n' 'HERE="$(dirname "$(readlink -f "$0")")"'
            # shellcheck disable=SC2016
            printf '%s\n' 'export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            # shellcheck disable=SC2016
            printf 'exec "$HERE/usr/%s" "$@"\n' "$APP_BIN_NAME"
          } > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$APPIMAGETOOL" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$APPIMAGETOOL"

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGETOOL" \
            "$APPDIR" "$DIST_DIR/neoagent-linux-x86_64-$VERSION.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-linux-installer
          path: |
            dist/neoagent-linux-amd64-*.deb
            dist/neoagent-arch-x86_64-*.pkg.tar.zst
            dist/neoagent-linux-x86_64-*.AppImage
          if-no-files-found: error

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bundled web client for Linux runtime
        working-directory: ${{ github.workspace }}/flutter_app
        run: |
          BUILD_ID="$(node ../scripts/web_build_id.js)"
          flutter build web \
            --output ../server/public \
            --dart-define=NEOAGENT_BACKEND_URL= \
            --dart-define=NEOAGENT_WEB_BUILD_ID="$BUILD_ID"

      - name: Install Linux backend dependencies
        working-directory: ${{ github.workspace }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Build standalone Linux CLI
        if: inputs.release_tag != ''
        working-directory: ${{ github.workspace }}
        env:
          NEOAGENT_RUNTIME_SIGNING_PUBLIC_KEY: ${{ env.RUNTIME_SIGNING_PUBLIC_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(node -p process.arch)"
          node scripts/build_cli_sea.js \
            --output "dist/neoagent-cli-linux-$ARCH-$VERSION"

      - name: Prune Linux runtime dependencies
        working-directory: ${{ github.workspace }}
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Build Linux backend runtime
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(node -p process.arch)"
          STAGE="$RUNNER_TEMP/neoagent-runtime-linux-$ARCH"
          ASSET="$GITHUB_WORKSPACE/dist/neoagent-runtime-linux-$ARCH-$VERSION.zip"
          node scripts/stage_runtime.js --output "$STAGE" --node "$(command -v node)"
          (
            cd "$STAGE"
            zip -qry "$ASSET" .
          )
          node scripts/create_runtime_metadata.js \
            --asset "$ASSET" \
            --output "dist/neoagent-runtime-metadata-linux-$ARCH.json" \
            --platform linux \
            --architecture "$ARCH"

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-linux-runtime
          path: |
            dist/neoagent-cli-linux-*
            dist/neoagent-runtime-linux-*.zip
            dist/neoagent-runtime-metadata-linux-*.json
          if-no-files-found: error

  build-android-apks:
    name: Build Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android signing override
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Using bundled CI keystore from the repository."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/neoagent-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android runner project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RAW_VERSION="${RELEASE_TAG}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="0.0.${{ github.run_number }}"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android APKs
        run: |
          set -euo pipefail
          mkdir -p ../dist/android-build
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/android-build/app-release-standard.apk
          NEOAGENT_ANDROID_LAUNCHER_MODE=true \
            flutter build apk --release -t lib/main_launcher_entry.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/android-build/app-release-launcher.apk

      - name: Verify Android APK signing
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKS=(
            "../dist/android-build/app-release-standard.apk"
            "../dist/android-build/app-release-launcher.apk"
          )
          for APK_PATH in "${APKS[@]}"; do
            if [ ! -f "$APK_PATH" ]; then
              echo "APK not found at $APK_PATH"
              exit 1
            fi
          done
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::No Android release keystore configured; shipping these APKs unsigned."
            exit 0
          fi
          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "No Android build-tools directory found."
            exit 1
          fi
          for APK_PATH in "${APKS[@]}"; do
            "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "$APK_PATH"
            jarsigner -verify "$APK_PATH" >/dev/null
          done

      - name: Stage Android APK artifacts
        run: |
          set -euo pipefail
          mkdir -p ../dist
          if [ ! -f ../dist/android-build/app-release-standard.apk ] || [ ! -f ../dist/android-build/app-release-launcher.apk ]; then
            echo "Expected staged Android APKs were not produced."
            exit 1
          fi
          cp ../dist/android-build/app-release-standard.apk "../dist/neoagent-android-${{ steps.version.outputs.version }}.apk"
          cp ../dist/android-build/app-release-launcher.apk "../dist/neoagent-android-launcher-${{ steps.version.outputs.version }}.apk"
          ls -la ../dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-android-installer
          path: dist/*.apk
          if-no-files-found: error
