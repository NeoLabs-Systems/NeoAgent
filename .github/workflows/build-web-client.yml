name: Build Web Client

# public/ (the bundled Flutter web client) is generated output and is not
# committed by hand. This workflow rebuilds it on every push that could change it
# and commits the result back to the branch, so source checkouts always have a
# working web client without Flutter installed. Guarded against
# github-actions[bot] pushes to avoid retriggering itself in a loop.

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'flutter_app/**'
      - '.github/actions/build-web/**'
      - '.github/workflows/build-web-client.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and commit bundled web client
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          token: ${{ secrets.NEOLABS_GO_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Build web client
        uses: ./.github/actions/build-web

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push web bundle
        run: |
          git add -f public
          if git diff --cached --quiet; then
            echo "Web bundle unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(web-client): rebuild bundled web client [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
