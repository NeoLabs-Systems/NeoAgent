name: Release Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

jobs:
  ci:
    name: CI
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      upload_web: true

  release:
    name: Publish beta release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.beta_version.outputs.release_tag }}
      release_sha: ${{ steps.capture_release_sha.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta

      - name: Set up Go
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The next beta is <base>-beta.N where base is the larger of VERSION and the
      # patch after the latest stable tag, and N counts up per base.
      - name: Resolve next beta version
        id: beta_version
        run: |
          set -euo pipefail
          git fetch --tags --force
          file_version="$(go run ./cmd/neoagent-release version)"
          file_base="${file_version%%-*}"
          latest_stable="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)"
          latest_stable="${latest_stable:-0.0.0}"
          IFS=. read -r major minor patch <<< "$latest_stable"
          stable_next="${major}.${minor}.$((patch + 1))"
          base="$(printf '%s\n%s\n' "$file_base" "$stable_next" | sort -V | tail -n 1)"
          last_beta="$(git tag --list "v${base}-beta.*" | sed -nE "s/^v${base//./\\.}-beta\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"
          next=$(( ${last_beta:--1} + 1 ))
          version="${base}-beta.${next}"
          echo "NEW_VERSION=v${version}" >> "$GITHUB_ENV"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit beta release
        run: |
          go run ./cmd/neoagent-release set-version "${{ steps.beta_version.outputs.version }}"
          git add internal/buildinfo/VERSION package.json
          git commit -m "chore(beta-release): v${{ steps.beta_version.outputs.version }} [skip ci]"

      - name: Push beta release commit and tag
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin beta
            git rebase origin/beta
            git tag --force "${{ env.NEW_VERSION }}" -m "chore(beta-release): v${{ steps.beta_version.outputs.version }}"

            if git push origin HEAD:beta; then
              git push origin "${{ env.NEW_VERSION }}"
              exit 0
            fi

            echo "Beta branch changed during release push (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Create GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "${{ env.NEW_VERSION }}" >/dev/null 2>&1; then
              echo "GitHub prerelease ${{ env.NEW_VERSION }} already exists."
              exit 0
            fi
            if gh release create "${{ env.NEW_VERSION }}" \
              --title "Beta ${{ env.NEW_VERSION }}" \
              --generate-notes \
              --prerelease; then
              exit 0
            fi
            echo "GitHub release create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Add download links to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/neoagent-release release-download --tag "${{ env.NEW_VERSION }}"

      - name: Capture release sha
        id: capture_release_sha
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build Installers
    needs: release
    uses: ./.github/workflows/_build-installers.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      use_ci_web: true

  build-firmware:
    name: Build Wearable Firmware
    needs: release
    uses: ./.github/workflows/_build-firmware.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker Image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      use_ci_web: true

  publish-release-assets:
    name: Publish Release Assets
    if: always() && needs.release.result == 'success'
    needs:
      - release
      - build-installers
      - build-firmware
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit

  notify-discord:
    name: Notify Discord
    needs: release
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
