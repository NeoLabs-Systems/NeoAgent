name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_web:
        description: Build and upload web bundle for downstream release jobs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Setup contract is current
        run: go run ./cmd/neoagent-release setup-contract --check

  go-lint-build:
    name: Go lint and static builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Static build
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/neoagent
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -o /dev/null ./cmd/neoagent-guest
          done

  flutter-test:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run Flutter unit and widget tests
        working-directory: flutter_app
        run: flutter test ../test/flutter/unit ../test/flutter/widget

      - name: Set up Go for web build
        if: ${{ inputs.upload_web == true }}
        uses: ./.github/actions/setup-go

      - name: Build web client
        if: ${{ inputs.upload_web == true }}
        uses: ./.github/actions/build-web

      - name: Upload CI web bundle
        if: ${{ inputs.upload_web == true }}
        uses: actions/upload-artifact@v4
        with:
          name: neoagent-ci-web-bundle
          path: public
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Verify uploaded web build ID
        if: ${{ inputs.upload_web == true }}
        uses: actions/download-artifact@v4
        with:
          name: neoagent-ci-web-bundle
          path: ${{ runner.temp }}/neoagent-ci-web-bundle

      - name: Check web bundle metadata
        if: ${{ inputs.upload_web == true }}
        run: |
          test -s "$RUNNER_TEMP/neoagent-ci-web-bundle/.last_build_id"
          cmp public/.last_build_id "$RUNNER_TEMP/neoagent-ci-web-bundle/.last_build_id"
