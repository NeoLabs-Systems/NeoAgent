name: Reusable Release Assets

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to upload assets to
        required: true
        type: string
    secrets:
      NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  publish-release-assets:
    name: Attach Installers to Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          pattern: neoagent-windows-installer-*
          merge-multiple: true
        continue-on-error: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          pattern: neoagent-macos-installer-*
          merge-multiple: true
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          name: neoagent-linux-installer
          merge-multiple: true
        continue-on-error: true

      - name: Download Windows runtime
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          pattern: neoagent-windows-runtime-*
          merge-multiple: true

      - name: Download macOS runtime
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          pattern: neoagent-macos-runtime-*
          merge-multiple: true

      - name: Download Linux runtime
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          name: neoagent-linux-runtime
          merge-multiple: true

      - name: Download Android artifact
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          name: neoagent-android-installer
          merge-multiple: true
        continue-on-error: true

      - name: Download firmware artifact
        uses: actions/download-artifact@v4.2.0
        with:
          path: dist
          name: neoagent-wearable-firmware
          merge-multiple: true

      - name: Verify runtime signing keypair
        env:
          NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY is required to publish signed runtime manifests."
            exit 1
          fi
          node -e "require('./lib/setup/runtime_manifest').assertRuntimeSigningKeypair(process.env.NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY)"

      - name: Create signed backend runtime manifest
        env:
          NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/create_runtime_manifest.js \
            --input dist \
            --output "dist/neoagent-runtime-manifest-$VERSION.json" \
            --version "$VERSION"
          node scripts/verify_runtime_manifest.js \
            --manifest "dist/neoagent-runtime-manifest-$VERSION.json" \
            --signature "dist/neoagent-runtime-manifest-$VERSION.json.sig"

      - name: Create signed release asset manifest
        env:
          NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.NEOAGENT_RUNTIME_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/create_release_manifest.js \
            --input dist \
            --output "dist/neoagent-release-manifest-$VERSION.json" \
            --version "$VERSION"

      - name: Collect release files
        id: release_files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.apk
            dist/neoagent-cli-*
            dist/neoagent-runtime-*.zip
            dist/neoagent-runtime-manifest-*.json
            dist/neoagent-runtime-manifest-*.json.sig
            dist/neoagent-release-manifest-*.json
            dist/neoagent-release-manifest-*.json.sig
          )
          for firmware_file in \
            dist/neoagent-wearable-firmware.bin \
            dist/neoagent-wearable-bootloader.bin \
            dist/neoagent-wearable-partition-table.bin \
            dist/neoagent-wearable-firmware.bin.sha256
          do
            if [ -f "$firmware_file" ]; then
              files+=("$firmware_file")
            fi
          done
          if [ ! -f dist/neoagent-wearable-firmware.bin ]; then
            echo "The required wearable firmware release asset is missing."
            exit 1
          fi
          if [ ! -f dist/neoagent-wearable-firmware.bin.sha256 ]; then
            echo "The required wearable firmware checksum is missing."
            exit 1
          fi
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded."
            exit 1
          fi
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to GitHub release
        uses: ./.github/actions/attach-release-assets
        with:
          release_tag: ${{ inputs.release_tag }}
          files: ${{ steps.release_files.outputs.files }}

      - name: Refresh release download notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release_download.js --tag "${{ inputs.release_tag }}"
