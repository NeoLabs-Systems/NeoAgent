# NeoAgent with Docker Compose: docker compose up -d
# Then open http://localhost:3333/app and create the first account (it becomes the admin).
# Faster cloud computers: add compose.kvm.yaml or compose.docker.yaml (see docs/docker.md).
name: neoagent

services:
  neoagent:
    image: ghcr.io/neolabs-systems/neoagent:latest
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      # Every address people open NeoAgent at in a browser, comma-separated, e.g.
      # http://192.168.1.20:3333,https://agent.example.com. Empty allows only localhost.
      ALLOWED_ORIGINS: ""
      # The HTTPS address behind a reverse proxy, e.g. https://agent.example.com.
      PUBLIC_URL: ""
    volumes:
      - neoagent-data:/data

volumes:
  neoagent-data:
