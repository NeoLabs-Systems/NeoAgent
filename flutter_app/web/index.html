<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Self-hosted AI agent with browser, terminal, and Android control — runs on your own server and keeps working after the chat ends.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NeoAgent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NeoAgent</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Resolve the theme and language the app will pick (shared_preferences
    // keeps them in localStorage as "flutter.<key>"), so the splash below
    // matches the Flutter SplashView that replaces it.
    (function () {
      function stored(key) {
        try { return JSON.parse(localStorage.getItem('flutter.' + key)); } catch (_) { return null; }
      }
      var mode = stored('app.themeMode');
      var dark = mode === 'dark' ||
        (mode !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
      var lang = stored('appLanguage');
      if (lang !== 'de' && lang !== 'en') {
        var locales = navigator.languages || [navigator.language || 'en'];
        lang = 'en';
        for (var i = 0; i < locales.length; i++) {
          var code = String(locales[i]).slice(0, 2).toLowerCase();
          if (code === 'de' || code === 'en') { lang = code; break; }
        }
      }
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.lang = lang;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&display=swap">

  <style>
    /* Pre-Flutter splash. A copy of SplashView (lib/main_app_shell.dart) with
       the palette from lib/src/theme/palette.dart, so the handoff to Flutter
       is invisible. Keep the two in sync. */
    :root {
      --bg-primary: #0E1511;
      --bg-secondary: #171F1A;
      --text-primary: #ECEFE5;
      --accent: #E1B052;
      --progress-track: #54452A;
    }
    :root[data-theme="light"] {
      --bg-primary: #F4F1E8;
      --bg-secondary: #EDE9DC;
      --text-primary: #1C2117;
      --accent: #B07D2B;
      --progress-track: #FADEBC;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg-primary);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle 130vmin at 30% 20%,
        var(--accent) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
      color: var(--text-primary);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      transition: opacity 0.5s ease;
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 52px;
      height: 52px;
      border-radius: 12.48px;
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    #splash-logo .light { display: none; }
    :root[data-theme="light"] #splash-logo .dark { display: none; }
    :root[data-theme="light"] #splash-logo .light { display: block; }
    #splash-logo img { width: 52px; height: 52px; }

    #splash-word {
      margin-top: 18px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    /* Flutter's indeterminate LinearProgressIndicator: two bars whose head
       and tail run on the same intervals and curves over 1.8s. */
    #splash-progress {
      position: relative;
      width: 180px;
      height: 4px;
      margin-top: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--progress-track);
    }
    #splash-progress span {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 100%;
      background: var(--accent);
    }
    #splash-progress .bar-1 {
      animation: bar1-head 1.8s infinite linear, bar1-tail 1.8s infinite linear;
    }
    #splash-progress .bar-2 {
      animation: bar2-head 1.8s infinite linear, bar2-tail 1.8s infinite linear;
    }
    @keyframes bar1-head {
      0% { right: 100%; animation-timing-function: cubic-bezier(0.2, 0, 0.8, 1); }
      41.67%, 100% { right: 0%; }
    }
    @keyframes bar1-tail {
      0%, 18.5% { left: 0%; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      60.17%, 100% { left: 100%; }
    }
    @keyframes bar2-head {
      0%, 55.56% { right: 100%; animation-timing-function: cubic-bezier(0, 0, 0.65, 1); }
      87.06%, 100% { right: 0%; }
    }
    @keyframes bar2-tail {
      0%, 70.39% { left: 0%; animation-timing-function: cubic-bezier(0.1, 0, 0.45, 1); }
      100% { left: 100%; }
    }

    #splash-label {
      margin-top: 14px;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.25px;
    }
    #splash-label .de { display: none; }
    :root[lang="de"] #splash-label .de { display: inline; }
    :root[lang="de"] #splash-label .en { display: none; }
  </style>
</head>
<body>
  <div id="splash" role="presentation" aria-hidden="true">
    <div id="splash-logo">
      <img class="dark" src="icons/Icon-192.png" alt="">
      <img class="light" src="icons/Icon-192-light.png" alt="">
    </div>
    <div id="splash-word">NeoAgent</div>
    <div id="splash-progress"><span class="bar-1"></span><span class="bar-2"></span></div>
    <div id="splash-label"><span class="en">Loading NeoAgent</span><span class="de">NeoAgent wird geladen</span></div>
  </div>

  <script>
    // Fade the splash once Flutter mounts its view (or after a safety timeout),
    // so we never get stuck showing it if the mutation never fires.
    (function () {
      var splash = document.getElementById('splash');
      var hidden = false;

      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-hidden');
        setTimeout(function () { splash.remove(); }, 550);
      }

      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(hideSplash, 6000);
    })();
  </script>

  <!-- flutter_soloud WASM runtime for streamed live voice playback. -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- EU storage notice, shared with the landing pages (same origin). -->
  <script src="/js/cookie-notice.js" defer></script>
</body>
</html>
