# Machine-readable loop pattern registry for NeoAgent.

patterns:
  - id: product-automation-runtime
    name: Product Automation Runtime
    file: ../LOOP.md
    goal: Keep scheduled, event-triggered, messaging, widget, and delegated agent runs autonomous under budget and safety guardrails.
    cadence: user-defined
    risk: medium
    tools: [neoagent, integrations, mcp]
    skills: [loop-verifier]
    state: ../STATE.md
    phases: [trigger, execute, verify, deliver, log]
    human_gates: [budget-exhausted, paused-loop, approval-required-tools, repeated-failures, delivery-errors]
    week_one_mode: L2
    token_cost: medium
    cost:
      tokens_noop: 3000
      tokens_report: 50000
      tokens_action: 250000
      suggested_daily_cap: 250000
      early_exit_required: true

  - id: maintenance-triage
    name: Maintenance Triage
    file: ../LOOP.md
    goal: Review NeoAgent loop health, CI/test failures, recent changes, and follow-up items without changing source unless explicitly requested.
    cadence: 1d
    risk: low
    tools: [codex]
    skills: [loop-verifier]
    state: ../STATE.md
    phases: [scan, prioritize, report, escalate]
    human_gates: [architecture, security, auth, billing, release, large-refactors]
    week_one_mode: L1
    token_cost: low
    cost:
      tokens_noop: 5000
      tokens_report: 50000
      tokens_action: 150000
      suggested_daily_cap: 100000
      early_exit_required: false
