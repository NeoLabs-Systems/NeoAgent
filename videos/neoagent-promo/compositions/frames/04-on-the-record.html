  <script>
    (function () {
      const FID = "04-on-the-record";
      const R = document.querySelector('[data-composition-id="' + FID + '"]');
      const q = (n) => R.querySelectorAll('[class~="' + FID + "-" + n + '"]');
      const tl = gsap.timeline({ paused: true });

      const HIDE_R = "inset(0% 100% 0% 0%)"; // hidden, reveals left -> right
      const HIDE_B = "inset(0% 0% 100% 0%)"; // hidden, reveals top -> down
      const SHOWN = "inset(0% 0% 0% 0%)";

      // Scene 1 (0.0-1.1s): the selected row lights, highlight sweeps left -> right
      tl.fromTo(q("rowdim"), { clipPath: SHOWN }, { clipPath: "inset(0% 0% 0% 100%)", duration: 0.75, ease: "power3.inOut" }, 0.25);

      // Scene 2 (1.1-3.2s): detail reveals top-down
      tl.fromTo(q("title"), { clipPath: HIDE_B, y: 12, opacity: 0 }, { clipPath: SHOWN, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.1);

      // stat cells cascade left -> right, 0.09s apart, each a clip reveal
      tl.fromTo(q("cell"), { clipPath: HIDE_B, y: 10, opacity: 0 }, { clipPath: SHOWN, y: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.09 }, 1.4);

      tl.fromTo(q("tabs"), { clipPath: HIDE_B, y: 10, opacity: 0 }, { clipPath: SHOWN, y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.95);
      tl.fromTo(q("axis"), { clipPath: HIDE_R, opacity: 0 }, { clipPath: SHOWN, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.1);

      // timeline rows appear, then each green bar draws left -> right in run order
      const rows = q("trow");
      const bars = q("bar");
      tl.fromTo(rows[0], { clipPath: HIDE_R, opacity: 0 }, { clipPath: SHOWN, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.25);
      tl.fromTo(bars[0], { clipPath: HIDE_R }, { clipPath: SHOWN, duration: 0.3, ease: "power2.out" }, 2.55);
      tl.fromTo(rows[1], { clipPath: HIDE_R, opacity: 0 }, { clipPath: SHOWN, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.45);
      tl.fromTo(bars[1], { clipPath: HIDE_R }, { clipPath: SHOWN, duration: 0.3, ease: "power2.out" }, 2.85);

      tl.fromTo(q("legend"), { clipPath: HIDE_R, opacity: 0 }, { clipPath: SHOWN, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.75);

      // Scene 3 (3.2-4.5s): hold, still
      tl.set({}, {}, 4.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
