    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FACE = [
          ".........",
          ".........",
          "..##.##..",
          "..##.##..",
          "..##.##..",
          ".........",
          ".........",
          ".........",
          ".........",
        ];
        var TILE = 220, PAD = 30, DOT = 13;
        var CELL = (TILE - PAD * 2) / 9;
        var tile = document.getElementById("neoagent06-tile");
        var lit = []; // in row-major order (top row first, left to right)

        for (var r = 0; r < 9; r++) {
          for (var c = 0; c < 9; c++) {
            var cx = PAD + CELL * c + CELL / 2;
            var cy = PAD + CELL * r + CELL / 2;
            var d = document.createElement("div");
            d.className = "neoagent06-dot";
            d.style.left = cx - DOT / 2 + "px";
            d.style.top = cy - DOT / 2 + "px";
            tile.appendChild(d);
            if (FACE[r].charAt(c) === "#") {
              var h = document.createElement("div");
              h.className = "neoagent06-halo";
              h.style.left = cx - 20 + "px";
              h.style.top = cy - 20 + "px";
              var l = document.createElement("div");
              l.className = "neoagent06-lit";
              l.style.left = cx - DOT / 2 + "px";
              l.style.top = cy - DOT / 2 + "px";
              tile.appendChild(h);
              tile.appendChild(l);
              lit.push({ row: r, dot: l, halo: h });
            }
          }
        }

        var tl = gsap.timeline({ paused: true });

        // Scene 1 — tile arrives, lit dots switch on row by row from the top
        tl.fromTo(
          tile,
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
          0
        );
        lit.forEach(function (p, i) {
          var t = 0.42 + i * 0.03;
          tl.fromTo(p.dot, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, t);
          tl.fromTo(p.halo, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.15, duration: 0.14, ease: "power2.out" }, t);
          tl.to(p.halo, { opacity: 0.4, scale: 1, duration: 0.45, ease: "power3.out" }, t + 0.14);
        });

        // Scene 2 — wordmark slides in behind its mask, repo address fades up
        tl.fromTo(
          "#neoagent06-wordmark",
          { x: -30, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          1.1
        );
        tl.fromTo(
          "#neoagent06-repo",
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          1.45
        );

        // Scene 3 — one blink at 2.4s: rows 2–4 collapse to row 4 only for 3 frames
        lit.forEach(function (p) {
          if (p.row < 4) {
            tl.set([p.dot, p.halo], { visibility: "hidden" }, 2.4);
            tl.set([p.dot, p.halo], { visibility: "visible" }, 2.5);
          }
        });

        // Final 0.35s — the film's only exit: fade to the canvas colour
        tl.fromTo("#neoagent06-fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 3.15);

        window.__timelines = window.__timelines || {};
        window.__timelines["06-neoagent"] = tl;
      })();
