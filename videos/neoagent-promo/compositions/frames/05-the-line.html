    <script>
      (function () {
        const FID = "05-the-line";
        const P = "line05";
        const q = (id) => document.getElementById(P + "-" + id);
        const tl = gsap.timeline({ paused: true });


        // Scene 2 (0.5–2.2s): per-word staggered rise from a line mask, 0.11s apart.
        // Word windows are pre-computed once (dynamic-content-sequencing); the gold pair lands last, slower.
        const WORDS = [
          { id: "w1", dur: 0.6 },
          { id: "w2", dur: 0.6 },
          { id: "w3", dur: 0.6 },
          { id: "w4", dur: 0.6 },
          { id: "w5", dur: 0.6 },
          { id: "w6", dur: 0.85, lead: 0.1 },
          { id: "w7", dur: 0.9, lead: 0.05 },
        ];
        let t = 0.5;
        WORDS.forEach((w, i) => {
          if (i > 0) t += 0.11 + (w.lead || 0);
          tl.fromTo(q(w.id), { y: 24, yPercent: 100, opacity: 0 }, { y: 0, yPercent: 0, opacity: 1, duration: w.dur, ease: "power3.out" }, t);
        });

        // Scene 3 (2.2–2.9s): eyebrow label types in quietly, one character per step.
        const LABEL = "SELF-HOSTED";
        const QUIET = " · OPEN SOURCE";
        const labelEl = q("label");
        const quietEl = q("quiet");
        const chars = [];
        [
          [labelEl, LABEL],
          [quietEl, QUIET],
        ].forEach(([el, text]) => {
          for (const ch of text) {
            const s = document.createElement("span");
            s.textContent = ch === " " ? " " : ch;
            el.appendChild(s);
            chars.push(s);
          }
        });
        const TYPE_START = 2.2;
        // The gold dot leads the eyebrow: it lands just before the first letter types.
        tl.fromTo(q("dot"), { opacity: 0, scale: 0.4, x: -10 }, { opacity: 1, scale: 1, x: 0, duration: 0.35, ease: "power3.out" }, TYPE_START - 0.12);
        const STEP = 0.6 / chars.length;
        chars.forEach((s, i) => {
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, TYPE_START + i * STEP);
        });

        // Scene 4 (2.9–4.0s): hold, still. Pad the timeline to the full duration.
        tl.set({}, {}, 4);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
