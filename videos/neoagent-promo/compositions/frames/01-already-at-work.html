          <!-- paragraph split into its three text lines for a per-line mask -->

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const DUR = 7;
      const tl = gsap.timeline({ paused: true });

      const world = document.getElementById("f01-world");
      const patch = document.getElementById("f01-patch");
      const field = document.getElementById("f01-field");
      const textEl = document.getElementById("f01-text");
      const caret = document.getElementById("f01-caret");

      // ---- typing schedule: ~70 chars/s, deterministic per-index variation ----
      const PROMPT =
        "Put the three flats from this morning side by side. I care about rent, size and the bike ride to the studio.";
      const TYPE_START = 0.06;
      const TYPE_END = 1.5;
      const weights = [];
      let wSum = 0;
      for (let i = 0; i < PROMPT.length; i++) {
        const w = 1 + 0.35 * Math.sin(i * 12.9898) + (PROMPT[i] === " " ? 0.25 : 0);
        weights.push(w);
        wSum += w;
      }
      const charTimes = [];
      let acc = TYPE_START;
      for (let i = 0; i < PROMPT.length; i++) {
        acc += (weights[i] / wSum) * (TYPE_END - TYPE_START);
        charTimes.push(acc);
      }
      function charsAt(t) {
        let n = 0;
        while (n < charTimes.length && t >= charTimes[n]) n++;
        return n;
      }

      // ---- camera: cam(cx, cy, S) puts plate-css (cx, cy) at canvas centre ----
      const CAM_A = { cx: 942, cy: 918, s: 1.9 };
      const CAM_B = { cx: 938, cy: 380, s: 1.45 };
      const MOVE_AT = 1.7;
      const MOVE_DUR = 1.0;
      const moveEase = gsap.parseEase("expo.inOut");
      function camAt(t) {
        const p = moveEase(Math.min(1, Math.max(0, (t - MOVE_AT) / MOVE_DUR)));
        return {
          cx: CAM_A.cx + (CAM_B.cx - CAM_A.cx) * p,
          cy: CAM_A.cy + (CAM_B.cy - CAM_A.cy) * p,
          s: CAM_A.s + (CAM_B.s - CAM_A.s) * p,
        };
      }

      const CLEAR_AT = 1.7;
      let lastN = -1;

      function render(t) {
        const c = camAt(t);
        world.style.transform =
          "translate(" + (960 - c.cx * c.s) + "px," + (540 - c.cy * c.s) + "px) scale(" + c.s + ")";

        const typing = t < CLEAR_AT;
        patch.style.visibility = typing ? "visible" : "hidden";
        field.style.visibility = typing ? "visible" : "hidden";
        if (typing) {
          const n = charsAt(t);
          if (n !== lastN) {
            textEl.textContent = PROMPT.slice(0, n);
            lastN = n;
          }
          caret.style.opacity = "1";
        }
      }

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );
      render(0);

      // ---- Scene 1: send press at 1.55 (1 -> 0.9 -> 1, smooth) ----
      tl.fromTo("#f01-btn", { scale: 1 }, { scale: 0.9, duration: 0.11, ease: "power2.inOut" }, 1.55);
      tl.fromTo(
        "#f01-btn",
        { scale: 0.9 },
        { scale: 1, duration: 0.11, ease: "power2.inOut", immediateRender: false },
        1.66,
      );

      // ---- Scene 2: user bubble rises into place ----
      tl.fromTo("#f01-user", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.75);

      // ---- Scene 3: avatar + answer card opens top -> bottom ----
      tl.fromTo("#f01-avatar", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.7);
      tl.fromTo(
        "#f01-shell",
        { clipPath: "inset(0% 0% 100% 0%)", opacity: 0 },
        { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.55, ease: "power3.out" },
        2.78,
      );

      // ---- Scene 4: answer draws in order ----
      const bands = ["#f01-intro", "#f01-thead", "#f01-row1", "#f01-row2", "#f01-row3"];
      bands.forEach(function (sel, i) {
        tl.fromTo(sel, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.4 + i * 0.22);
      });
      ["#f01-para1", "#f01-para2", "#f01-para3"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" },
          4.55 + i * 0.15,
        );
      });
      tl.fromTo(
        "#f01-ask",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power2.out" },
        5.08,
      );
      tl.fromTo("#f01-meta", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 5.4);
      tl.set("#f01-card", { opacity: 1 }, 5.72);

      // ---- Scene 5 (5.7-7.0): hold; camera already fixed at CAM_B ----

      window.__timelines["01-already-at-work"] = tl;
    })();
  </script>
