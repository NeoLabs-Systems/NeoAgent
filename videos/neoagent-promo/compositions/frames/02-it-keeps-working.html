  <script>
    (function () {
      var ID = "02-it-keeps-working";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var part = function (n) { return root.querySelector('[data-part="' + n + '"]'); };
      var piece = function (n) { return root.querySelector('[data-piece="' + n + '"]'); };
      var layer = function (n) { return root.querySelector('[data-plate="' + n + '"]'); };

      var cam = part("cam");
      var zt = part("zt");
      var scroll = part("scroll");

      // Camera convention: cam(cx, cy, S) puts plate-css (cx, cy) at canvas centre at scale S.
      // Tweened directly on the wrapper's transform (seek-safe; no callbacks).
      var cv = function (c) { return { x: 960 - c[2] * c[0], y: 540 - c[2] * c[1], scale: c[2] }; };
      gsap.set(cam, cv([938, 380, 1.45]));

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.1): the column scrolls up 343 plate-css; second request rises in; camera eases down.
      tl.set(cam, cv([938, 380, 1.45]), 0);
      tl.fromTo(scroll, { y: 343 }, { y: 0, duration: 1.1, ease: "power3.inOut" }, 0);
      tl.to(cam, Object.assign(cv([938, 560, 1.45]), { duration: 1.1, ease: "power3.inOut" }), 0);
      tl.fromTo(piece("cl-user"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.3);

      // Scene 2 (1.1–3.0): avatar + answer card open top→bottom, receipt draws on its own beats.
      tl.fromTo(piece("cl-avatar"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.1);
      tl.fromTo(
        piece("cl-shell"),
        { clipPath: "inset(0% 0% 100% 0% round 14px)", opacity: 0.6 },
        { clipPath: "inset(0% 0% 0% 0% round 14px)", opacity: 1, duration: 0.55, ease: "power3.out" },
        1.15
      );
      var rise = function (el, at, dist, dur) {
        tl.fromTo(el, { opacity: 0, y: dist || 12 }, { opacity: 1, y: 0, duration: dur || 0.45, ease: "power3.out" }, at);
      };
      rise([piece("runhead-a"), piece("runhead-c")], 1.75, 12);
      tl.fromTo(piece("runhead-pill"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.05);
      rise(piece("cl-steps"), 1.95, 12);
      rise(piece("cl-memsave"), 2.2, 14, 0.5);
      rise(piece("cl-createtask"), 2.5, 14, 0.5);
      var lineMask = function (el, at) {
        tl.fromTo(
          el,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" },
          at
        );
      };
      lineMask(piece("cl-line1"), 1.3);
      lineMask(piece("cl-line2"), 1.45);
      tl.fromTo(piece("cl-hide"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.62);
      tl.fromTo(piece("cl-meta"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.75);
      tl.set(piece("cl-card"), { opacity: 1 }, 3.06);

      // Scene 3 (3.0–3.9): zoom-to-target on create_task, accelerating; zoom-through seam to the Tasks plate.
      var CUT = 3.5;
      tl.to(cam, Object.assign(cv([905, 764, 2.0]), { duration: CUT - 3.0, ease: "power3.in" }), 3.0);
      tl.fromTo(zt, { filter: "blur(0px)" }, { filter: "blur(18px)", duration: 0.25, ease: "power3.in", immediateRender: false }, CUT - 0.25);
      tl.fromTo(zt, { opacity: 1 }, { opacity: 0.35, duration: 0.2, ease: "none", immediateRender: false }, CUT - 0.2);
      tl.set(layer("chat"), { opacity: 0 }, CUT);
      tl.set(layer("tasks"), { opacity: 1 }, CUT);
      tl.set(piece("task1"), { opacity: 0 }, CUT);

      tl.to(cam, Object.assign(cv([938, 400, 1.5]), { duration: 1.3, ease: "expo.out" }), CUT);
      tl.fromTo(zt, { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, CUT);
      tl.fromTo(zt, { opacity: 0.35 }, { opacity: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, CUT);

      // Scene 4 (3.9–6.0): the new task lands first, the rest cascade in below; hold from ~5.2.
