<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0E1511;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-already-at-work"
        class="scene"
        data-composition-id="01-already-at-work"
        data-composition-src="compositions/frames/01-already-at-work.html"
        data-start="0"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-02-it-keeps-working"
        class="scene"
        data-composition-id="02-it-keeps-working"
        data-composition-src="compositions/frames/02-it-keeps-working.html"
        data-start="7"
        data-duration="6.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-it-remembers"
        class="scene"
        data-composition-id="03-it-remembers"
        data-composition-src="compositions/frames/03-it-remembers.html"
        data-start="13"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-on-the-record"
        class="scene"
        data-composition-id="04-on-the-record"
        data-composition-src="compositions/frames/04-on-the-record.html"
        data-start="18"
        data-duration="5.1"
        data-track-index="1"
      ></div>

      <div
        id="el-05-the-line"
        class="scene"
        data-composition-id="05-the-line"
        data-composition-src="compositions/frames/05-the-line.html"
        data-start="22.5"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-neoagent"
        class="scene"
        data-composition-id="06-neoagent"

        data-start="26.5"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <!-- music: "Titanium Intent" (from Downloads), excerpt from 32.79s so its lift lands on the 13.0s cut; ducked under the voice and faded out in assets/audio/music-bed.mp3 -->
      <audio
        id="el-bgm"
        src="assets/audio/music-bed.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="1.78"
      ></audio>

      <!-- voiceover (ElevenLabs eleven_v4, voice "Hale"), one clip per line; see SCRIPT.md -->
      <audio
        id="el-vo-1"
        src="assets/audio/vo-1.mp3"
        data-start="0.9"
        data-duration="5.100"
        data-track-index="10"
        data-audio-group="voiceover"
        data-volume="1.78"
      ></audio>
      <audio
        id="el-vo-2"
        src="assets/audio/vo-2.mp3"

      ></audio>
      <audio

      <audio

      ></audio>
      <audio
        id="el-vo-6"
        src="assets/audio/vo-6.mp3"
        data-start="26.95"
        data-duration="3.020"
        data-track-index="10"
        data-audio-group="voiceover"
        data-volume="1.78"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-it-keeps-working", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-03-it-remembers", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 13);
        tl.to("#el-03-it-remembers", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.fromTo("#el-04-on-the-record", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.to("#el-04-on-the-record", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 22.5);
        tl.fromTo("#el-05-the-line", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 22.5);
        tl.to("#el-05-the-line", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.5);
        tl.fromTo("#el-06-neoagent", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
