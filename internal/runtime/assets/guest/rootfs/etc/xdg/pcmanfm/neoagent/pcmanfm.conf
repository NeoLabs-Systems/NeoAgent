[config]
bm_open_method=0
su_cmd=sudo -A %s
autorun=1
media_in_new_tab=0
close_on_unmount=1

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[ui]
always_show_tabs=0
hide_close_btn=0
win_width=960
win_height=600
splitter_pos=180
max_tab_chars=32
view_mode=icon
show_hidden=0
show_thumbs=1
sort=name;ascending;
toolbar=newtab;navigation;home;
show_statusbar=1
pathbar_mode_buttons=0
